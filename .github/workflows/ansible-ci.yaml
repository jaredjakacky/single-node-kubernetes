name: Ansible CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible tooling
        run: python -m pip install --requirement requirements.txt

      - name: Test workflow execution policy
        working-directory: .
        run: python tests/test_verify_workflow_policy.py

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Verify Ansible runtime contract
        run: |
          config="$(ansible-config dump --only-changed)"
          grep --extended-regexp --quiet \
            '^INJECT_FACTS_AS_VARS\([^)]*ansible.cfg\) = False$' <<< "$config"
          grep --extended-regexp --quiet \
            '^INTERPRETER_PYTHON\([^)]*ansible.cfg\) = /usr/bin/python3$' <<< "$config"
          if grep --recursive --line-number \
            --include='*.yml' \
            --include='*.yaml' \
            --include='*.j2' \
            --include='*.cfg' \
            '\bansible_date_time\b' .; then
            echo "Injected ansible_date_time references are not permitted"
            exit 1
          fi

      - name: Lint Ansible
        run: ansible-lint

      - name: Check playbook syntax
        run: |
          ansible-playbook \
            --inventory inventory/ci.yml \
            --syntax-check \
            playbooks/node.yml
          ansible-playbook \
            --inventory inventory/ci.yml \
            --syntax-check \
            playbooks/bootstrap.yml

      - name: Test bootstrap state classification as root
        run: sudo "$(command -v ansible-playbook)" tests/bootstrap-state.yml

      - name: Test kubeadm kubelet argument validation
        run: ansible-playbook tests/kubeadm-flags.yml

      - name: Test Kubernetes Node condition validation
        run: ansible-playbook tests/node-conditions.yml

      - name: Test static Pod manifest security validation
        run: ansible-playbook tests/static-manifest-boundary.yml

      - name: Verify the pinned kubelet Debian package contract
        run: |
          python tests/test_verify_kubelet_package_contract.py
          kubernetes_version="$(python -c '
          import yaml
          with open("roles/kubernetes/defaults/main.yml") as stream:
              print(yaml.safe_load(stream)["kubernetes_version"])
          ')"
          kubernetes_package_version="$(KUBERNETES_VERSION="${kubernetes_version}" python -c '
          import os
          import yaml
          with open("roles/kubernetes/defaults/main.yml") as stream:
              value = yaml.safe_load(stream)["kubernetes_package_version"]
          print(value.replace("{{ kubernetes_version }}", os.environ["KUBERNETES_VERSION"]))
          ')"
          kubernetes_minor="${kubernetes_version%.*}"
          package_path="/tmp/kubelet_${kubernetes_package_version}_amd64.deb"
          package_url="https://pkgs.k8s.io/core:/stable:/v${kubernetes_minor}/deb/amd64"
          curl --fail --location --silent --show-error \
            --output "${package_path}" \
            "${package_url}/kubelet_${kubernetes_package_version}_amd64.deb"
          python tests/verify-kubelet-package-contract.py \
            --version "${kubernetes_package_version}" \
            "${package_path}"

      - name: Download the pinned kubeadm test binary
        run: |
          kubernetes_version="$(python -c 'import yaml; print(yaml.safe_load(open("roles/kubernetes/defaults/main.yml"))["kubernetes_version"])')"
          curl --fail --location --silent --show-error \
            --output /tmp/kubeadm \
            "https://dl.k8s.io/release/v${kubernetes_version}/bin/linux/amd64/kubeadm"
          curl --fail --location --silent --show-error \
            --output /tmp/kubeadm.sha256 \
            "https://dl.k8s.io/release/v${kubernetes_version}/bin/linux/amd64/kubeadm.sha256"
          echo "$(tr -d '\n' < /tmp/kubeadm.sha256)  /tmp/kubeadm" | sha256sum --check
          chmod 0755 /tmp/kubeadm

      - name: Validate the kubeadm configuration
        run: >-
          ansible-playbook
          --extra-vars kubernetes_bootstrap_test_kubeadm_path=/tmp/kubeadm
          tests/kubeadm-config.yml
