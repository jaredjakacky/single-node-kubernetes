name: Ansible CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible tooling
        run: python -m pip install --requirement requirements.txt

      - name: Lint Ansible
        run: ansible-lint

      - name: Check playbook syntax
        run: >-
          ansible-playbook
          --inventory inventory/ci.yml
          --syntax-check
          playbooks/node.yml
