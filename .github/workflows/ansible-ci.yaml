name: Ansible CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible tooling
        run: python -m pip install --requirement requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint Ansible
        run: ansible-lint

      - name: Check playbook syntax
        run: |
          ansible-playbook \
            --inventory inventory/ci.yml \
            --syntax-check \
            playbooks/node.yml
          ansible-playbook \
            --inventory inventory/ci.yml \
            --syntax-check \
            playbooks/bootstrap.yml

      - name: Test bootstrap state classification
        run: ansible-playbook tests/bootstrap-state.yml

      - name: Download the pinned kubeadm test binary
        run: |
          kubernetes_version="$(python -c 'import yaml; print(yaml.safe_load(open("roles/kubernetes/defaults/main.yml"))["kubernetes_version"])')"
          curl --fail --location --silent --show-error \
            --output /tmp/kubeadm \
            "https://dl.k8s.io/release/v${kubernetes_version}/bin/linux/amd64/kubeadm"
          curl --fail --location --silent --show-error \
            --output /tmp/kubeadm.sha256 \
            "https://dl.k8s.io/release/v${kubernetes_version}/bin/linux/amd64/kubeadm.sha256"
          echo "$(tr -d '\n' < /tmp/kubeadm.sha256)  /tmp/kubeadm" | sha256sum --check
          chmod 0755 /tmp/kubeadm

      - name: Validate the kubeadm configuration
        run: >-
          ansible-playbook
          --extra-vars kubernetes_bootstrap_test_kubeadm_path=/tmp/kubeadm
          tests/kubeadm-config.yml
