---
- name: Bootstrap the Kubernetes control plane
  hosts: kubernetes_control_plane
  gather_facts: true
  become: true
  serial: 1

  pre_tasks:
    - name: Refuse Kubernetes bootstrap in Ansible check mode
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: >-
          Kubernetes bootstrap and its runtime health checks cannot be
          represented safely in Ansible check mode. Run this playbook without
          --check.

    - name: Require exactly one control-plane host
      ansible.builtin.assert:
        that:
          - groups['kubernetes_control_plane'] | length == 1
        fail_msg: >-
          This repository supports exactly one Kubernetes control-plane host.
          The kubernetes_control_plane inventory group contains
          {{ groups['kubernetes_control_plane'] | length }} hosts.

    - name: Validate installed Kubernetes tooling for bootstrap
      ansible.builtin.import_role:
        name: kubernetes
        tasks_from: validate.yml
        public: true

  roles:
    - role: kubernetes_bootstrap
