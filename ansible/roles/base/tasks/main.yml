---
- name: Require Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
    fail_msg: >-
      The base role supports only Debian 13. Detected
      {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}.

- name: Require an amd64 host
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in ["x86_64", "amd64"]
    fail_msg: >-
      The base role supports only x86-64/amd64. Detected
      {{ ansible_facts.architecture }}.

- name: Require systemd
  ansible.builtin.assert:
    that:
      - ansible_facts.service_mgr == "systemd"
    fail_msg: >-
      The base role requires systemd. Detected
      {{ ansible_facts.service_mgr }}.

- name: Check for the cgroup v2 controllers file
  ansible.builtin.stat:
    path: /sys/fs/cgroup/cgroup.controllers
  register: base_cgroup_v2_controllers

- name: Require cgroup v2
  ansible.builtin.assert:
    that:
      - base_cgroup_v2_controllers.stat.exists
      - base_cgroup_v2_controllers.stat.isreg | default(false)
    fail_msg: >-
      cgroup v2 is required, but /sys/fs/cgroup/cgroup.controllers is not a
      regular file. Enable cgroup v2 before applying this role.

- name: Disable active swap
  ansible.builtin.command: /sbin/swapoff --all
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([ \t]*)([^# \t]\S*[ \t]+\S+[ \t]+swap(?:[ \t]+[^# \t]\S*){0,3})([ \t]*(?:#.*)?)$'
    replace: '\1# Ansible disabled swap: \2\3'

- name: Check whether the overlay module is loaded
  ansible.builtin.stat:
    path: /sys/module/overlay
  register: base_overlay_module

- name: Load the overlay module
  ansible.builtin.command: /sbin/modprobe overlay
  when: not base_overlay_module.stat.exists
  changed_when: true

- name: Load the overlay module at boot
  ansible.builtin.copy:
    content: "overlay\n"
    dest: /etc/modules-load.d/single-node-kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: Read runtime IPv4 forwarding state
  ansible.builtin.command: /sbin/sysctl --values net.ipv4.ip_forward
  register: base_ipv4_forward
  changed_when: false

- name: Enable IPv4 forwarding at runtime
  ansible.builtin.command: /sbin/sysctl --write net.ipv4.ip_forward=1
  when: base_ipv4_forward.stdout | trim != "1"
  changed_when: true

- name: Persist IPv4 forwarding
  ansible.builtin.copy:
    content: "net.ipv4.ip_forward = 1\n"
    dest: /etc/sysctl.d/90-single-node-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply Kubernetes sysctl settings
