---
- name: Validate the effective OpenSSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  listen: Validate and reload OpenSSH

- name: Reload the OpenSSH daemon
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Validate and reload OpenSSH
