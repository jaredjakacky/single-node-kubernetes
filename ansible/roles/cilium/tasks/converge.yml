---
- name: Inspect the immutable Cilium chart metadata
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - show
      - chart
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
  environment: "{{ cilium_helm_environment }}"
  register: cilium_chart_metadata
  changed_when: false
  when: cilium_release_action in ['install', 'upgrade']

- name: Validate the immutable Cilium chart identity
  ansible.builtin.assert:
    that:
      - cilium_chart_metadata.stdout is search('(?m)^name: cilium$')
      - >-
        cilium_chart_metadata.stdout
        is search(
          '(?m)^version: [''\"]?'
          ~ (cilium_chart_version | regex_escape)
          ~ '[''\"]?$'
        )
      - >-
        cilium_chart_metadata.stdout
        is search(
          '(?m)^appVersion: [''\"]?'
          ~ (cilium_chart_version | regex_escape)
          ~ '[''\"]?$'
        )
    fail_msg: >-
      The immutable OCI digest did not resolve to the expected Cilium
      {{ cilium_chart_version }} chart and application metadata.
  when: cilium_release_action in ['install', 'upgrade']

- name: Validate desired values against the pinned chart schema
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - template
      - "{{ cilium_release_name }}"
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
      - --namespace
      - "{{ cilium_release_namespace }}"
      - --values
      - "{{ cilium_values_path }}"
      - --kube-version
      - 1.36.0
  environment: "{{ cilium_helm_environment }}"
  register: cilium_chart_template_output
  changed_when: false
  when: cilium_release_action in ['install', 'upgrade']

- name: Require the expected pinned Cilium workloads to render
  ansible.builtin.assert:
    that:
      - >-
        cilium_chart_template_output.stdout
        is search('(?m)^kind: DaemonSet\nmetadata:\n  name: cilium$')
      - >-
        cilium_chart_template_output.stdout
        is search('(?m)^kind: Deployment\nmetadata:\n  name: cilium-operator$')
    fail_msg: >-
      The pinned chart and canonical values did not render the required Cilium
      agent and operator workloads.
  when: cilium_release_action in ['install', 'upgrade']

- name: Install the pinned Cilium chart by immutable digest
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - install
      - "{{ cilium_release_name }}"
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
      - --namespace
      - "{{ cilium_release_namespace }}"
      - --values
      - "{{ cilium_values_path }}"
      - --kubeconfig
      - "{{ cilium_kubeconfig_path }}"
      - --rollback-on-failure
      - --wait
      - --wait-for-jobs
      - --timeout
      - "{{ cilium_helm_timeout }}"
  environment: "{{ cilium_helm_environment }}"
  changed_when: true
  when: cilium_release_action == 'install'

- name: Upgrade the pinned Cilium chart by immutable digest
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - upgrade
      - "{{ cilium_release_name }}"
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
      - --namespace
      - "{{ cilium_release_namespace }}"
      - --values
      - "{{ cilium_values_path }}"
      - --kubeconfig
      - "{{ cilium_kubeconfig_path }}"
      - --rollback-on-failure
      - --wait
      - --wait-for-jobs
      - --timeout
      - "{{ cilium_helm_timeout }}"
      - --history-max
      - "10"
  environment: "{{ cilium_helm_environment }}"
  changed_when: true
  when: cilium_release_action == 'upgrade'
