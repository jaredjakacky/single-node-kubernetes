---
- name: Inspect the immutable Cilium chart metadata
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - show
      - chart
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
  environment: "{{ cilium_helm_environment }}"
  register: cilium_chart_metadata
  changed_when: false
  when: cilium_release_action in ['install', 'upgrade']

- name: Validate the immutable Cilium chart identity
  ansible.builtin.import_tasks:
    file: validate_chart_metadata.yml

- name: Validate desired values against the pinned chart schema
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - template
      - "{{ cilium_release_name }}"
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
      - --namespace
      - "{{ cilium_release_namespace }}"
      - --values
      - "{{ cilium_values_path }}"
      - --kube-version
      - 1.36.0
  environment: "{{ cilium_helm_environment }}"
  register: cilium_chart_template_output
  changed_when: false
  when: cilium_release_action in ['install', 'upgrade']

- name: Validate the expected pinned Cilium workloads
  ansible.builtin.import_tasks:
    file: validate_rendered_workloads.yml

- name: Install the pinned Cilium chart by immutable digest
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - install
      - "{{ cilium_release_name }}"
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
      - --namespace
      - "{{ cilium_release_namespace }}"
      - --values
      - "{{ cilium_values_path }}"
      - --kubeconfig
      - "{{ cilium_kubeconfig_path }}"
      - --rollback-on-failure
      - --wait
      - --wait-for-jobs
      - --timeout
      - "{{ cilium_helm_timeout }}"
  environment: "{{ cilium_helm_environment }}"
  changed_when: true
  when: cilium_release_action == 'install'

- name: Upgrade the pinned Cilium chart by immutable digest
  ansible.builtin.command:
    argv:
      - "{{ cilium_helm_binary }}"
      - upgrade
      - "{{ cilium_release_name }}"
      - "{{ cilium_chart_oci_repository }}@{{ cilium_chart_digest }}"
      - --namespace
      - "{{ cilium_release_namespace }}"
      - --values
      - "{{ cilium_values_path }}"
      - --kubeconfig
      - "{{ cilium_kubeconfig_path }}"
      - --rollback-on-failure
      - --wait
      - --wait-for-jobs
      - --timeout
      - "{{ cilium_helm_timeout }}"
      - --history-max
      - "10"
  environment: "{{ cilium_helm_environment }}"
  changed_when: true
  when: cilium_release_action == 'upgrade'
