---
- name: Create the kubeadm configuration directory
  ansible.builtin.file:
    path: "{{ kubernetes_bootstrap_config_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the kubeadm initialization configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: "{{ kubernetes_bootstrap_config_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/bin/kubeadm config validate --config %s
